name: Telegram Contact Sync

on:
  schedule:
    # Every Monday at 11:00 UTC = 4:00 PM Pakistan time
    - cron: "0 11 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  telegram-contact-sync:

    name: Weekly Telegram Contact Sync

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon python-dotenv

      - name: Restore Telegram session
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          echo "$TELEGRAM_SESSION" | base64 --decode > telegram_invite_session.session

      - name: Create environment file
        run: |
          echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}" >> .env
          echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> .env

      - name: Run Telegram contact sync
        run: |
          python sync_telegram_contacts.py

      - name: Commit contact sync results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add selected_contacts.json
          git add contact_sync_log.json

          if git diff --cached --quiet; then
            echo "No contact sync changes to commit."
          else
            git commit -m "Update Telegram contacts"
            git push
          fi
