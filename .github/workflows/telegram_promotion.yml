name: Telegram Promotion Campaign

on:
  schedule:
    # Daily at 12:00 UTC = 5:00 PM Pakistan time
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  telegram-promotion:

    name: Run Telegram Promotion

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon python-dotenv

      - name: Restore Telegram session
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          echo "$TELEGRAM_SESSION" | base64 --decode > telegram_session.zip
          unzip -o telegram_session.zip
          
      - name: Create environment file
        run: |
          echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}" >> .env
          echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> .env

      - name: Run Telegram promotion
        run: |
          python telegram_invite.py

      - name: Commit campaign history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent_contacts.json
          git add campaign_log.json

          if git diff --cached --quiet; then
            echo "No campaign history changes to commit."
          else
            git commit -m "Update Telegram campaign history"
            git push
          fi
